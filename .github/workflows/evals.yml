name: evals

on:
  push:
  pull_request:

jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      # Verifies the graders, the case schema and the report renderer against
      # the offline stub. This asserts the harness works. It asserts nothing
      # about any real system.
      - name: Run the suite against the offline stub
        run: python3 -m runner.run --adapter echo --fail-on any
